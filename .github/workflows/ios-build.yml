name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - run: npm install
      
      - name: Create app package
        run: |
          mkdir -p app-package
          cp -r www app-package/ || cp index.html app-package/
          cp server.js app-package/ 2>/dev/null || true
          cp package.json app-package/ 2>/dev/null || true
      
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: system-app-files
          path: app-package/
          retention-days: 5
