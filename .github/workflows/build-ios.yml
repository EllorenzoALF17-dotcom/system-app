name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g @capacitor/cli
          
      - name: Build web assets
        run: |
          mkdir -p www
          cp index.html www/index.html 2>/dev/null || true
          
      - name: Init Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "System" "com.yourname.systemgrowth" --web-dir www
          fi
          
      - name: Add iOS
        run: npx cap add ios || true
        
      - name: Sync Capacitor
        run: npx cap sync
        
      - name: Build iOS
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
          
      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios/
          retention-days: 5
